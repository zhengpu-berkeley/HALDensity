[project]
name = "haldensity"
version = "0.1.0"
description = "Highly Adaptive Lasso MLE TMLE Density Estimation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "cvxpy>=1.7",
    "optuna>=4.4",
    "ecos>=2.0.12",
    "scikit-learn>=1.3",
    "pydantic>=2.12.3",
]
license = { file = "LICENSE" }
keywords = ["density", "HAL", "TMLE", "L1", "spline", "MLE"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Framework :: Jupyter",
]

[project.urls]
Homepage = "https://github.com/zhengpu-berkeley/HALDensity"
Repository = "https://github.com/zhengpu-berkeley/HALDensity"
Issues = "https://github.com/zhengpu-berkeley/HALDensity/issues"

[project.optional-dependencies]
cvx = ["cvxpy>=1.7", "ecos>=2.0.12", "scs>=3.2", "clarabel>=0.9"]
tuning = ["optuna>=4.4"]
dev = ["ruff>=0.6", "pytest>=7.4", "mypy>=1.7", "build>=1.2", "twine>=5.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
"haldensity" = ["py.typed"]
